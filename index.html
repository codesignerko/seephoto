<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시선으로 여는 사진 (프로토타입)</title>
    <script src="https://webgazer.cs.brown.edu/webgazer.js" type="text/javascript"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background-color: #111; font-family: sans-serif; overflow: hidden; }
        
        /* 메인 캔버스: 사진과 블러 효과가 그려지는 곳 */
        #photoCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* 안내 메시지 레이어 */
        #infoOverlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            text-align: center;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: opacity 0.5s;
        }

        /* 웹캠 가이드 UI (WebGazer 기본 UI 상단에 고정) */
        #webgazerVideoFeed, #webgazerFaceOverlay, #webgazerFaceFeedbackBox {
            top: auto !important;
            bottom: 20px !important;
            left: 20px !important;
            transform: scale(0.7);
            transform-origin: bottom left;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div id="infoOverlay">
        📷 <b>카메라 권한을 허용</b>해 주세요.<br>
        화면에 빨간 점이 나타나면, <b>점을 응시하면서 마우스로 5~6번 클릭</b>해 영점을 맞춰주세요!
    </div>

    <canvas id="photoCanvas"></canvas>

    <script>
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        const infoOverlay = document.getElementById('infoOverlay');

        // 브라우저 창 크기에 맞게 캔버스 설정
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 테스트용 고화질 빈티지 무드 사진 (Unsplash 무료 이미지 주소)
        // 나중에 지수님 사진 파일(예: 'my_pic.jpg')로 변경 가능합니다.
        const imageSrc = "https://images.unsplash.com/photo-1542038784456-1ea8e935640e?q=80&w=2070";
        
        const img = new Image();
        img.crossOrigin = "anonymous"; // 외부 이미지 로드를 위한 설정
        img.src = imageSrc;

        img.onload = () => {
            // 1. 처음에 이미지를 아주 흐리게(Blur) 전체 화면으로 그리기
            ctx.filter = 'blur(40px) grayscale(30%)';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            // 2. 이미지 로딩 완료 후 시선 추적 엔진 가동
            initEyeTracking();
        };

        function initEyeTracking() {
            webgazer.setGazeListener((data, elapsedTime) => {
                if (data == null) return;

                // 실시간 사용자의 시선 좌표
                const x = data.x;
                const y = data.y;

                // 영점 조절이 어느 정도 되면 안내문 변경
                if (elapsedTime > 7000) {
                    infoOverlay.innerHTML = "🎯 영점 조절 완료! 이제 <b>화면의 흐릿한 부분을 지긋이 바라보세요.</b>";
                    infoOverlay.style.opacity = "0.4";
                }

                // 3. 시선이 머무는 지점의 블러를 서서히 지워내기
                ctx.save();
                // 'destination-out'은 새로 그리는 영역을 투명하게 뚫어버리는 효과입니다.
                ctx.globalCompositeOperation = 'destination-out'; 
                
                // 시선 중심은 완벽히 뚫고, 외곽으로 갈수록 부드럽게 번지는 그라데이션 원형 생성
                const blurRadius = 90; // 지워지는 반경
                const gradient = ctx.createRadialGradient(x, y, 5, x, y, blurRadius);
                gradient.addColorStop(0, 'rgba(0, 0, 0, 1)');      // 중심부 (완전 투명화)
                gradient.addColorStop(0.8, 'rgba(0, 0, 0, 0.2)');  // 중간 부드러운 경계
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');      // 외곽 (안 지워짐)
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, blurRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

            }).begin();

            // 빨간색 시선 예측 점 보기 활성화
            webgazer.showPredictionPoints(true); 
        }

        // 창 크기가 바뀔 때 대응
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.filter = 'blur(40px) grayscale(30%)';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        });
    </script>
</body>
</html>

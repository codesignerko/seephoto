<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>필름이 마르는 동안</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #C7BB98;
    --bg-2: #B6A97F;
    --paper: #F6F0E2;
    --paper-shadow: #E3D9BE;
    --ink: #362C20;
    --ink-dim: #83745C;
    --stamp: #FF7A29;
    --line: rgba(54,44,32,0.16);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; overscroll-behavior:none;
    font-family:'Inter',sans-serif; color:var(--ink);
    background: radial-gradient(120% 140% at 50% -10%, var(--bg) 0%, var(--bg-2) 100%);
  }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* 은은한 필름 그레인 */
  #grain{ position:fixed; inset:0; z-index:80; pointer-events:none; opacity:0.05; mix-blend-mode:multiply; }

  .eyebrow{ font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ink-dim); }
  h1{ font-family:'Caveat',cursive; font-weight:700; font-size:26px; margin:0; color:var(--ink); }

  #topbar{ padding: max(16px, env(safe-area-inset-top)) 22px 8px; z-index:20; }

  .btn{
    -webkit-appearance:none; appearance:none; cursor:pointer; border:none;
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    padding:13px 26px; border-radius:999px; background:var(--ink); color:var(--paper);
  }
  .btn.ghost{ background:transparent; border:1.5px solid var(--line); color:var(--ink); font-weight:500; }
  .btn:active{ transform:scale(0.97); }
  .btn-row{ display:flex; gap:10px; }

  /* ---------------- SCREEN 0: 인트로 ---------------- */
  #screen-intro{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center; padding:0 30px; }
  #screen-intro p{ max-width:320px; color:var(--ink-dim); font-size:14px; line-height:1.75; }
  #screen-intro .mark{ font-family:'Caveat',cursive; font-size:22px; color:var(--stamp); }
  #permission-error{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:40px; text-align:center; color:var(--ink-dim); font-size:14px; line-height:1.7; background:var(--bg); z-index:50; }

  /* ---------------- SCREEN 1: 촬영(뷰파인더) ---------------- */
  #screen-camera{ position:absolute; inset:0; display:none; flex-direction:column; }
  #viewfinder-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding: 8px 22px; }
  #viewfinder{ position:relative; width:100%; max-width:420px; aspect-ratio:1/1; background:#000; border-radius:6px; overflow:hidden;
    box-shadow: 0 0 0 1px var(--line), 0 18px 40px rgba(54,44,32,0.28); }
  #cam-video{ display:none; }
  #preview-canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .corner{ position:absolute; width:22px; height:22px; border-color:rgba(246,240,226,0.85); pointer-events:none; }
  .corner.tl{ top:10px; left:10px; border-top:2px solid; border-left:2px solid; }
  .corner.tr{ top:10px; right:10px; border-top:2px solid; border-right:2px solid; }
  .corner.bl{ bottom:10px; left:10px; border-bottom:2px solid; border-left:2px solid; }
  .corner.br{ bottom:10px; right:10px; border-bottom:2px solid; border-right:2px solid; }
  #frame-counter{
    position:absolute; top:12px; left:16px; font-family:'Space Mono',monospace; font-size:11px;
    letter-spacing:0.08em; color:rgba(246,240,226,0.9);
  }
  #cam-hint{
    position:absolute; bottom:12px; left:0; right:0; text-align:center;
    font-size:11.5px; color:rgba(246,240,226,0.75); padding:0 30px;
  }
  #camera-controls{ display:flex; align-items:center; justify-content:center; gap:34px; padding: 20px 0 max(26px, env(safe-area-inset-bottom)); }
  .shutter-btn{
    width:70px; height:70px; border-radius:50%; background:var(--paper);
    border:4px solid rgba(54,44,32,0.14); box-shadow:0 6px 20px rgba(54,44,32,0.22);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .shutter-btn:active{ transform:scale(0.93); }
  .shutter-inner{ width:52px; height:52px; border-radius:50%; background:var(--ink); }
  .icon-btn{
    width:44px; height:44px; border-radius:50%; background:rgba(246,240,226,0.16);
    border:1px solid rgba(246,240,226,0.35); color:var(--paper); font-size:17px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  /* ---------------- SCREEN 2: 폴라로이드 ---------------- */
  #screen-result{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding: 30px 24px; overflow:hidden; }
  #polaroid{
    width:100%; max-width:360px; background:var(--paper); padding:18px 18px 26px;
    border-radius:3px; box-shadow: 0 2px 0 rgba(255,255,255,0.5) inset, 0 24px 50px rgba(54,44,32,0.35);
    transform: translateY(120%) rotate(0deg); opacity:0;
  }
  #polaroid.eject{ animation: eject 0.85s cubic-bezier(.2,.8,.25,1) forwards; }
  @keyframes eject{
    0%{ transform: translateY(120%) rotate(0deg); opacity:0; }
    70%{ opacity:1; }
    100%{ transform: translateY(0) rotate(var(--tilt,-2deg)); opacity:1; }
  }
  #photo-frame{ position:relative; width:100%; aspect-ratio:1/1; background:#111; border-radius:1px; overflow:hidden; }
  #photo-frame canvas{ position:absolute; inset:0; width:100%; height:100%; }
  #stamp{
    position:absolute; right:8px; bottom:7px; font-family:'Space Mono',monospace; font-weight:700;
    font-size:11px; letter-spacing:0.06em; color:var(--stamp); text-shadow: 0 0 6px rgba(0,0,0,0.35);
  }
  #caption{
    margin-top:14px; font-family:'Caveat',cursive; font-size:21px; color:var(--ink);
    text-align:center; outline:none; min-height:28px; opacity:0.85;
  }
  #dev-status{
    margin-top:6px; text-align:center; font-family:'Space Mono',monospace; font-size:10.5px;
    letter-spacing:0.1em; color:var(--ink-dim); transition:opacity 0.4s ease;
  }
  #result-actions{
    position:absolute; bottom: max(26px, env(safe-area-inset-bottom)); left:0; right:0;
    display:flex; gap:10px; justify-content:center; opacity:0; pointer-events:none;
    transform:translateY(6px); transition:all 0.6s ease;
  }
  #result-actions.show{ opacity:1; pointer-events:auto; transform:none; }

  #shake-badge{
    position:fixed; left:0; right:0; bottom: max(96px, calc(env(safe-area-inset-bottom) + 90px));
    text-align:center; font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-dim);
    opacity:0; transition:opacity 0.3s ease; z-index:30; pointer-events:none;
  }
  #shake-badge.active{ opacity:1; color:var(--stamp); }
</style>
</head>
<body>
<div id="app">
  <canvas id="grain"></canvas>

  <div id="topbar">
    <div class="eyebrow">INSTANT FILM</div>
    <h1>필름이 마르는 동안</h1>
  </div>

  <!-- SCREEN 0 -->
  <div id="screen-intro">
    <div class="mark">shake to develop</div>
    <p>
      정사각형으로 사진을 찍어요. 찍는 동안 화면은 모자이크로 가려져 있어서<br/>
      뭘 찍었는지는 나중에야 알 수 있어요.<br/><br/>
      사진은 시간이 지나면 저절로 선명해지고, <b>폰을 흔들수록 훨씬 빨리</b> 선명해집니다.
    </p>
    <div class="btn-row"><button class="btn" id="start-btn">카메라 켜고 시작하기</button></div>
    <div id="permission-error">카메라에 접근할 수 없습니다.<br/>브라우저의 카메라 권한과 https 접속 여부를 확인해주세요.</div>
  </div>

  <!-- SCREEN 1 -->
  <div id="screen-camera">
    <div id="viewfinder-wrap">
      <div id="viewfinder">
        <video id="cam-video" autoplay muted playsinline></video>
        <canvas id="preview-canvas"></canvas>
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
        <div id="frame-counter">NO. <span id="frame-num">001</span></div>
        <div id="cam-hint">모자이크 너머는 나중에 확인하세요</div>
      </div>
    </div>
    <div id="camera-controls">
      <button class="icon-btn" id="flip-btn">⟲</button>
      <button class="shutter-btn" id="shutter-btn"><span class="shutter-inner"></span></button>
      <div style="width:44px;"></div>
    </div>
  </div>

  <!-- SCREEN 2 -->
  <div id="screen-result">
    <div id="polaroid">
      <div id="photo-frame">
        <canvas id="sharp-canvas"></canvas>
        <canvas id="mosaic-canvas"></canvas>
        <div id="stamp"></div>
      </div>
      <div id="caption" contenteditable="true" data-placeholder="여기에 적어보세요"></div>
      <div id="dev-status">현상 중 · <b id="dev-pct">0</b>%</div>
    </div>
    <div id="result-actions">
      <button class="btn ghost" id="retake-btn">다시 찍기</button>
      <button class="btn" id="save-btn">저장하기</button>
    </div>
  </div>

  <div id="shake-badge">흔드는 중 · 빠르게 현상됩니다</div>
</div>

<script>
(function(){
  "use strict";

  const screenIntro = document.getElementById('screen-intro');
  const screenCamera = document.getElementById('screen-camera');
  const screenResult = document.getElementById('screen-result');
  const startBtn = document.getElementById('start-btn');
  const permError = document.getElementById('permission-error');
  const videoEl = document.getElementById('cam-video');
  const previewCanvas = document.getElementById('preview-canvas');
  const shutterBtn = document.getElementById('shutter-btn');
  const flipBtn = document.getElementById('flip-btn');
  const frameNumEl = document.getElementById('frame-num');
  const polaroid = document.getElementById('polaroid');
  const sharpCanvas = document.getElementById('sharp-canvas');
  const mosaicCanvas = document.getElementById('mosaic-canvas');
  const stampEl = document.getElementById('stamp');
  const devPct = document.getElementById('dev-pct');
  const devStatus = document.getElementById('dev-status');
  const resultActions = document.getElementById('result-actions');
  const retakeBtn = document.getElementById('retake-btn');
  const saveBtn = document.getElementById('save-btn');
  const shakeBadge = document.getElementById('shake-badge');

  let stream = null;
  let facingMode = 'environment';
  let frameCount = 0;
  let previewRaf = null;

  // ---------------- 필름 그레인 텍스처 ----------------
  (function paintGrain(){
    const c = document.getElementById('grain');
    const w = c.width = 160, h = c.height = 160;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(w,h);
    for(let i=0;i<img.data.length;i+=4){
      const v = 200 + Math.random()*55;
      img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=255;
    }
    ctx.putImageData(img,0,0);
    c.style.width='100%'; c.style.height='100%';
    c.style.imageRendering='pixelated';
  })();

  // ---------------- 모자이크(다운샘플→업샘플) ----------------
  const tmp = document.createElement('canvas');
  const tmpCtx = tmp.getContext('2d');
  function pixelate(sourceEl, sx, sy, ssize, destCtx, destSize, blocks){
    blocks = Math.max(2, Math.round(blocks));
    tmp.width = blocks; tmp.height = blocks;
    tmpCtx.imageSmoothingEnabled = true;
    tmpCtx.drawImage(sourceEl, sx, sy, ssize, ssize, 0, 0, blocks, blocks);
    destCtx.imageSmoothingEnabled = false;
    destCtx.clearRect(0,0,destSize,destSize);
    destCtx.drawImage(tmp, 0, 0, blocks, blocks, 0, 0, destSize, destSize);
  }

  // ---------------- 시작: 카메라 + (iOS) 모션 권한 ----------------
  startBtn.addEventListener('click', async ()=>{
    try{
      await startCamera();
    }catch(err){ permError.style.display='flex'; return; }

    if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
      try{ await DeviceMotionEvent.requestPermission(); }catch(e){}
    }
    bindMotion();

    screenIntro.style.display = 'none';
    screenCamera.style.display = 'flex';
    startPreviewLoop();
  });

  async function startCamera(){
    if(stream) stream.getTracks().forEach(t=>t.stop());
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal: facingMode } }, audio:false });
    }catch(e){
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode }, audio:false });
    }
    videoEl.srcObject = stream;
    await videoEl.play().catch(()=>{});
  }

  flipBtn.addEventListener('click', async ()=>{
    facingMode = (facingMode==='environment') ? 'user' : 'environment';
    try{ await startCamera(); }catch(e){}
  });

  // ---------------- 실시간 모자이크 프리뷰 ----------------
  const PREVIEW_BLOCKS = 16;
  function startPreviewLoop(){
    const ctx = previewCanvas.getContext('2d');
    function tick(){
      if(videoEl.videoWidth){
        const size = Math.min(videoEl.videoWidth, videoEl.videoHeight);
        const sx = (videoEl.videoWidth - size)/2, sy = (videoEl.videoHeight - size)/2;
        const displaySize = previewCanvas.width || 400;
        if(previewCanvas.width !== previewCanvas.clientWidth){
          previewCanvas.width = previewCanvas.clientWidth;
          previewCanvas.height = previewCanvas.clientHeight;
        }
        pixelate(videoEl, sx, sy, size, ctx, previewCanvas.width, PREVIEW_BLOCKS);
      }
      previewRaf = requestAnimationFrame(tick);
    }
    tick();
  }

  // ---------------- 촬영 ----------------
  shutterBtn.addEventListener('click', ()=>{
    if(!videoEl.videoWidth) return;
    const size = Math.min(videoEl.videoWidth, videoEl.videoHeight);
    const sx = (videoEl.videoWidth - size)/2, sy = (videoEl.videoHeight - size)/2;
    const outSize = Math.min(size, 900);

    sharpCanvas.width = outSize; sharpCanvas.height = outSize;
    const sctx = sharpCanvas.getContext('2d');
    sctx.filter = 'saturate(1.08) contrast(1.03) sepia(0.06)';
    sctx.drawImage(videoEl, sx, sy, size, size, 0, 0, outSize, outSize);

    frameCount++;
    frameNumEl.textContent = String(frameCount).padStart(3,'0');

    cancelAnimationFrame(previewRaf);
    screenCamera.style.display = 'none';
    screenResult.style.display = 'flex';

    const tilt = (Math.random()*4 - 2).toFixed(1)+'deg';
    polaroid.style.setProperty('--tilt', tilt);
    polaroid.classList.remove('eject'); void polaroid.offsetWidth; polaroid.classList.add('eject');

    stampEl.textContent = formatStamp(new Date());

    initDevelop(outSize);
  });

  function formatStamp(d){
    const y = String(d.getFullYear()).slice(2);
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `'${y} ${m} ${day}`;
  }

  retakeBtn.addEventListener('click', async ()=>{
    screenResult.style.display = 'none';
    screenCamera.style.display = 'flex';
    resultActions.classList.remove('show');
    devStatus.style.opacity = '1';
    try{ await startCamera(); }catch(e){}
    startPreviewLoop();
  });

  saveBtn.addEventListener('click', ()=>{
    const link = document.createElement('a');
    link.download = 'instant-film.png';
    link.href = sharpCanvas.toDataURL('image/png');
    link.click();
  });

  // ---------------- 흔들림 감지 ----------------
  let prevAcc = null;
  let shakeEnergy = 0;
  let shakeUiTimer = null;

  function bindMotion(){
    window.addEventListener('devicemotion', (e)=>{
      const acc = e.accelerationIncludingGravity || e.acceleration;
      if(!acc || acc.x==null) return;
      if(prevAcc){
        const delta = Math.abs(acc.x-prevAcc.x) + Math.abs(acc.y-prevAcc.y) + Math.abs(acc.z-prevAcc.z);
        if(delta > 3){
          shakeEnergy += delta;
          shakeBadge.classList.add('active');
          clearTimeout(shakeUiTimer);
          shakeUiTimer = setTimeout(()=>shakeBadge.classList.remove('active'), 400);
        }
      }
      prevAcc = { x:acc.x, y:acc.y, z:acc.z };
    });
  }

  // ---------------- 현상(전체 이미지 모자이크 → 선명) ----------------
  let progress = 0, lastT = 0, devRaf = null, developed = false;
  const PASSIVE_RATE = 1 / 55000;     // 가만히 두면 약 55초 안에 완성 (조절 가능)
  const SHAKE_FACTOR = 0.00042;       // 흔들림 에너지 → 진행도 변환 계수 (조절 가능)
  const SHAKE_DECAY = 0.86;           // 프레임마다 흔들림 에너지 감쇠

  function initDevelop(size){
    mosaicCanvas.width = size; mosaicCanvas.height = size;
    progress = 0; lastT = 0; developed = false; shakeEnergy = 0; prevAcc = null;
    devPct.textContent = '0';
    devStatus.style.opacity = '1';
    resultActions.classList.remove('show');
    if(devRaf) cancelAnimationFrame(devRaf);
    devRaf = requestAnimationFrame(loop);
  }

  function loop(t){
    if(!lastT) lastT = t;
    const dt = Math.min(50, t-lastT);
    lastT = t;

    if(!developed){
      progress += dt * PASSIVE_RATE;
      progress += shakeEnergy * SHAKE_FACTOR;
      shakeEnergy *= SHAKE_DECAY;
      if(progress >= 1){ progress = 1; developed = true; }

      const blocks = 4 + progress * (mosaicCanvas.width - 4);
      const ctx = mosaicCanvas.getContext('2d');
      if(progress < 0.995){
        pixelate(sharpCanvas, 0, 0, sharpCanvas.width, ctx, mosaicCanvas.width, blocks);
      } else {
        ctx.clearRect(0,0,mosaicCanvas.width, mosaicCanvas.height);
      }

      devPct.textContent = Math.round(progress*100);
      if(developed){
        devStatus.style.opacity = '0';
        resultActions.classList.add('show');
      }
    }

    devRaf = requestAnimationFrame(loop);
  }

  window.addEventListener('beforeunload', ()=>{ if(stream) stream.getTracks().forEach(t=>t.stop()); });
})();
</script>
</body>
</html>
